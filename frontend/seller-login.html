<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LocalLink - Seller Hub Login & Registration</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <script src="js/build-env.js"></script>
  <script src="js/app-bridge.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-slate-950">

  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- Top Back / Role Switcher Bar -->
    <div class="flex items-center justify-between text-xs">
      <a href="customer.html" onclick="window.LocalLinkApp.goToRole('customer');return false;" class="text-emerald-400 hover:text-emerald-300 font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> <span>Marketplace Home</span>
      </a>
      <button type="button" data-ll-role-trigger="true" onclick="window.LocalLinkApp.openRoleSwitcher()" class="px-2.5 py-1 bg-slate-950 hover:bg-slate-800 border border-emerald-500/40 text-emerald-300 rounded-lg text-[11px] font-bold flex items-center gap-1.5">
        <span id="llHeaderConnectionDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <i class="fa-solid fa-layer-group"></i> <span>Switch Role</span>
      </button>
    </div>

    <!-- Header / Branding -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-14 h-14 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-2xl items-center justify-center text-slate-950 text-2xl font-black shadow-lg shadow-emerald-500/20 mb-2">
        <i class="fa-solid fa-store"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">LocalLink Seller Hub</h1>
      <p class="text-xs sm:text-sm text-slate-400">Sell your local products directly to thousands of nearby neighbors</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="grid grid-cols-3 bg-slate-950/70 p-1.5 rounded-2xl border border-slate-800 text-xs font-bold text-center">
      <button id="tab-login" onclick="setAuthTab('login')" class="py-2.5 rounded-xl transition-all bg-emerald-600 text-white shadow-md">
        Seller Sign In
      </button>
      <button id="tab-register" onclick="setAuthTab('register')" class="py-2.5 rounded-xl transition-all text-slate-400 hover:text-white">
        Register Shop
      </button>
      <button id="tab-reset" onclick="setAuthTab('reset')" class="py-2.5 rounded-xl transition-all text-slate-400 hover:text-white">
        Reset Password
      </button>
    </div>

    <!-- Global Alert Banner -->
    <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5">
      <i id="alertIcon" class="fa-solid fa-circle-exclamation mt-0.5"></i>
      <span id="alertMessage" class="flex-1"></span>
    </div>

    <!-- 1. SELLER LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email or Phone Number</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
          <input id="loginIdentifier" type="text" required placeholder="name@shop.com or 9876543210"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Password</label>
          <button type="button" onclick="setAuthTab('reset')" class="text-xs text-emerald-400 hover:underline">Forgot password?</button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
          <input id="loginPassword" type="password" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
          <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300">
            <i id="loginEyeIcon" class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="rememberMe" type="checkbox" class="accent-emerald-500 rounded">
          <span>Remember this device</span>
        </label>
        <a href="login.html" class="text-slate-500 hover:text-slate-300">Admin Portal &rarr;</a>
      </div>

      <button id="loginBtn" type="submit"
        class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-950/60 transition-all flex items-center justify-center gap-2">
        <span>Enter Seller Panel</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <!-- Quick Test Fill button for seamless review -->
      <div class="p-3 bg-slate-950/60 border border-slate-800/80 rounded-xl flex items-center justify-between text-xs">
        <span class="text-slate-400">Demo Active Seller: <strong class="text-emerald-400">testseller@locallink.com</strong></span>
        <button type="button" onclick="fillTestSeller()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-lg text-[11px] transition-all">
          Auto-Fill
        </button>
      </div>
    </form>

    <!-- 2. SELLER REGISTRATION FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Owner Full Name *</label>
          <input id="regName" type="text" required placeholder="e.g. Ratan Sen"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Shop / Stall Name *</label>
          <input id="regShopName" type="text" required placeholder="e.g. Ratan Fresh Fish & Groceries"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Business Email *</label>
          <input id="regEmail" type="email" required placeholder="shop@example.com"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Phone Number *</label>
          <input id="regPhone" type="tel" required placeholder="9876543210"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Password (min 6 chars) *</label>
          <input id="regPassword" type="password" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Confirm Password *</label>
          <input id="regConfirmPassword" type="password" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Business Category *</label>
          <select id="regCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="Grocery & Packaged Foods">Grocery & Packaged Foods</option>
            <option value="Fresh Fish, Meat & Poultry">Fresh Fish, Meat & Poultry</option>
            <option value="Vegetables & Fruits">Vegetables & Fruits</option>
            <option value="Dairy & Bakery">Dairy & Bakery</option>
            <option value="Spices & Traditional Staples">Spices & Traditional Staples</option>
            <option value="Handicrafts & General Store">Handicrafts & General Store</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">City / Market Area</label>
          <input id="regCity" type="text" value="Kolkata" placeholder="Kolkata"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Shop Address / Stall Location</label>
        <textarea id="regAddress" rows="2" placeholder="e.g. Stall #14, Rajpur Sonarpur Main Bazaar"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
      </div>

      <label class="flex items-start gap-2.5 text-xs text-slate-400 cursor-pointer pt-1">
        <input id="regTerms" type="checkbox" required class="accent-emerald-500 mt-0.5">
        <span>I agree to LocalLink Marketplace Seller Terms, 5% platform service policy, and honest local quality guarantees.</span>
      </label>

      <button id="regBtn" type="submit"
        class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-950/60 transition-all flex items-center justify-center gap-2">
        <span>Submit Seller Application</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <!-- 3. FORGOT / RESET PASSWORD FORM -->
    <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4 hidden">
      <p class="text-xs text-slate-400">Enter your registered seller email address and your new desired password.</p>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Registered Seller Email</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
          <input id="resetEmail" type="email" required placeholder="seller@locallink.com"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">New Password (min 6 chars)</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
          <input id="resetPassword" type="password" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
        </div>
      </div>

      <button id="resetBtn" type="submit"
        class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-950/60 transition-all flex items-center justify-center gap-2">
        <span>Update Password</span>
        <i class="fa-solid fa-key"></i>
      </button>

      <div class="text-center">
        <button type="button" onclick="setAuthTab('login')" class="text-xs text-slate-400 hover:text-white">
          &larr; Back to Seller Login
        </button>
      </div>
    </form>

  </div>

  <script>
    // Uses LocalLinkApp bridge for dynamic server routing across Web, Android Emu, iOS & Wi-Fi LAN
    const API_BASE = "";

    function getStoredToken() {
      try {
        return localStorage.getItem("locallinkSellerToken") || sessionStorage.getItem("locallinkSellerToken");
      } catch (e) {
        return null;
      }
    }

    function removeStoredToken() {
      try {
        localStorage.removeItem("locallinkSellerToken");
        localStorage.removeItem("locallinkSellerUser");
        sessionStorage.removeItem("locallinkSellerToken");
        sessionStorage.removeItem("locallinkSellerUser");
      } catch (e) {}
    }

    // Check if seller already logged in
    window.addEventListener("DOMContentLoaded", () => {
      const token = getStoredToken();
      if (token) {
        fetch(`${API_BASE}/api/seller/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            window.location.href = "seller.html";
          } else {
            removeStoredToken();
          }
        })
        .catch(() => {});
      }
    });

    function showAlert(message, type = "error") {
      const box = document.getElementById("alertBox");
      const text = document.getElementById("alertMessage");
      const icon = document.getElementById("alertIcon");

      if (type === "success") {
        box.className = "p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-950/80 border border-emerald-800 text-emerald-200";
        icon.className = "fa-solid fa-circle-check mt-0.5 text-emerald-400";
      } else {
        box.className = "p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5 bg-rose-950/80 border border-rose-800 text-rose-200";
        icon.className = "fa-solid fa-circle-exclamation mt-0.5 text-rose-400";
      }
      text.textContent = message;
    }

    function hideAlert() {
      const box = document.getElementById("alertBox");
      if (box) box.className = "hidden p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5";
    }

    function setAuthTab(tab) {
      hideAlert();
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const resetForm = document.getElementById("resetForm");

      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const tabReset = document.getElementById("tab-reset");

      [tabLogin, tabRegister, tabReset].forEach(t => {
        t.className = "py-2.5 rounded-xl transition-all text-slate-400 hover:text-white";
      });

      loginForm.classList.add("hidden");
      registerForm.classList.add("hidden");
      resetForm.classList.add("hidden");

      if (tab === "login") {
        loginForm.classList.remove("hidden");
        tabLogin.className = "py-2.5 rounded-xl transition-all bg-emerald-600 text-white shadow-md";
      } else if (tab === "register") {
        registerForm.classList.remove("hidden");
        tabRegister.className = "py-2.5 rounded-xl transition-all bg-emerald-600 text-white shadow-md";
      } else if (tab === "reset") {
        resetForm.classList.remove("hidden");
        tabReset.className = "py-2.5 rounded-xl transition-all bg-emerald-600 text-white shadow-md";
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
 
    function fillTestSeller() {
      document.getElementById("loginIdentifier").value = "testseller@locallink.com";
      document.getElementById("loginPassword").value = "seller123";
    }

    // 1. Handle Login
    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById("loginBtn");
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Authenticating...</span>`;

      try {
        const identifier = document.getElementById("loginIdentifier").value.trim();
        const password = document.getElementById("loginPassword").value;
        const remember = document.getElementById("rememberMe").checked;

        const res = await fetch(`${API_BASE}/api/seller/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ loginIdentifier: identifier, password })
        });

        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch (e) {
          throw new Error("Unable to parse server response. Please verify backend is running on port 5001.");
        }

        if (!res.ok || !data.success) {
          throw new Error(data.message || "Login failed. Please check credentials.");
        }

        const token = data.data.token;
        const user = data.data.user;
        const shop = data.data.shop;

        if (remember) {
          localStorage.setItem("locallinkSellerToken", token);
          localStorage.setItem("locallinkSellerUser", JSON.stringify({ ...user, shop }));
        } else {
          sessionStorage.setItem("locallinkSellerToken", token);
          sessionStorage.setItem("locallinkSellerUser", JSON.stringify({ ...user, shop }));
        }

        showAlert("Login successful! Redirecting to your Seller Dashboard...", "success");
        setTimeout(() => {
          window.location.href = "seller.html";
        }, 800);
      } catch (err) {
        showAlert(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    // 2. Handle Register
    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const pwd = document.getElementById("regPassword").value;
      const confirmPwd = document.getElementById("regConfirmPassword").value;

      if (pwd !== confirmPwd) {
        showAlert("Passwords do not match!", "error");
        return;
      }

      const btn = document.getElementById("regBtn");
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Submitting Application...</span>`;

      try {
        const payload = {
          name: document.getElementById("regName").value.trim(),
          shopName: document.getElementById("regShopName").value.trim(),
          email: document.getElementById("regEmail").value.trim(),
          phone: document.getElementById("regPhone").value.trim(),
          password: pwd,
          confirmPassword: confirmPwd,
          businessCategory: document.getElementById("regCategory").value,
          city: document.getElementById("regCity").value.trim(),
          shopAddress: document.getElementById("regAddress").value.trim(),
          termsAccepted: document.getElementById("regTerms").checked
        };

        const res = await fetch(`${API_BASE}/api/seller/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch (e) {
          throw new Error("Unable to parse server response. Please verify backend is running on port 5001.");
        }

        if (!res.ok || !data.success) {
          throw new Error(data.message || "Registration failed.");
        }

        showAlert("Registration submitted successfully! Your account is pending admin approval. You can sign in once verified.", "success");
        document.getElementById("registerForm").reset();
        setTimeout(() => {
          setAuthTab("login");
        }, 3000);
      } catch (err) {
        showAlert(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    // 3. Handle Reset Password
    async function handleResetPassword(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById("resetBtn");
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Resetting...</span>`;

      try {
        const email = document.getElementById("resetEmail").value.trim();
        const newPassword = document.getElementById("resetPassword").value;

        const res = await fetch(`${API_BASE}/api/seller/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, newPassword })
        });

        const text = await res.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch (e) {
          throw new Error("Unable to parse server response. Please verify backend is running on port 5001.");
        }

        if (!res.ok || !data.success) {
          throw new Error(data.message || "Failed to reset password.");
        }

        showAlert(data.message || "Password updated successfully! Please sign in with your new password.", "success");
        setTimeout(() => {
          setAuthTab("login");
          document.getElementById("loginIdentifier").value = email;
        }, 1500);
      } catch (err) {
        showAlert(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }
  </script>
</body>
</html>
