<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LocalLink Admin Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <script src="js/build-env.js"></script>
  <script src="js/app-bridge.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-950 border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl shadow-emerald-950/20">
    <div class="flex items-center justify-between text-xs">
      <a href="customer.html" onclick="window.LocalLinkApp.goToRole('customer');return false;" class="text-emerald-400 hover:text-emerald-300 font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> <span>Marketplace Home</span>
      </a>
      <button type="button" data-ll-role-trigger="true" onclick="window.LocalLinkApp.openRoleSwitcher()" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-emerald-500/40 text-emerald-300 rounded-lg text-[11px] font-bold flex items-center gap-1.5">
        <span id="llHeaderConnectionDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <i class="fa-solid fa-layer-group"></i> <span>Switch Role</span>
      </button>
    </div>

    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-store"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">LocalLink</h1>
        <p class="text-xs text-emerald-400 font-semibold uppercase tracking-wider">Admin Control Hub</p>
      </div>
    </div>

    <div>
      <h2 class="text-lg font-semibold text-white">Sign In</h2>
      <p class="text-sm text-slate-400 mt-1">Enter your administrative credentials to continue</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Email</label>
        <input id="email" type="email" required
          class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm"
          placeholder="admin@locallink.com">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
        <input id="password" type="password" required
          class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm"
          placeholder="••••••••••••">
      </div>

      <button id="loginButton" type="submit"
        class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 p-3 font-bold text-white shadow-lg shadow-emerald-900/40 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Sign In to Admin Hub</span>
      </button>

      <p id="message" class="text-sm text-center" role="status"></p>
    </form>

    <div class="border-t border-slate-800 pt-5">
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 text-xs space-y-2">
        <div class="flex items-center justify-between text-slate-400">
          <span class="font-semibold text-emerald-400"><i class="fa-solid fa-key mr-1"></i> Pre-configured Admin</span>
          <button type="button" id="fillDemoBtn" class="text-xs text-sky-400 hover:text-sky-300 font-semibold underline">
            1-Click Fill
          </button>
        </div>
        <div class="text-slate-300">
          <p><span class="text-slate-500">Email:</span> <code class="text-emerald-300 font-mono">superadmin123@gmail.com</code></p>
          <p class="mt-1"><span class="text-slate-500">Password:</span> <code class="text-emerald-300 font-mono">Admin@12345678</code></p>
        </div>
      </div>
    </div>

    <div class="text-center pt-1 space-y-2">
      <div>
        <a href="customer.html" class="text-xs text-emerald-400 hover:text-emerald-300 font-semibold inline-flex items-center gap-1.5">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>Customer Marketplace (Buy Local) &rarr;</span>
        </a>
      </div>
      <div>
        <a href="delivery.html" class="text-xs text-sky-400 hover:text-sky-300 font-semibold inline-flex items-center gap-1.5">
          <i class="fa-solid fa-motorcycle"></i>
          <span>Delivery Partner / Rider Console &rarr;</span>
        </a>
      </div>
      <div>
        <a href="seller-login.html" class="text-xs text-slate-400 hover:text-slate-300 font-semibold inline-flex items-center gap-1.5">
          <i class="fa-solid fa-store"></i>
          <span>Local Shopkeeper? Go to Seller Hub &rarr;</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5001/api/admin/auth/login";

    // Auto-fill demo credentials
    document.getElementById("fillDemoBtn").addEventListener("click", () => {
      document.getElementById("email").value = "superadmin123@gmail.com";
      document.getElementById("password").value = "Admin@12345678";
    });

    // Check existing session
    const existingToken = sessionStorage.getItem("locallinkAdminToken") || localStorage.getItem("locallinkAdminToken");
    if (existingToken) {
      const msg = document.getElementById("message");
      msg.innerHTML = '<span class="text-emerald-400">Active session found. <a href="index.html" onclick="window.LocalLinkApp.goToRole(\'admin\');return false;" class="underline font-bold">Go to Dashboard →</a></span>';
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");
      button.disabled = true;
      message.textContent = "Signing in...";
      message.className = "text-sm text-center text-slate-400";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.data?.token) {
          throw new Error(result.message || "Invalid credentials or unauthorized.");
        }

        sessionStorage.setItem("locallinkAdminToken", result.data.token);
        sessionStorage.setItem("locallinkAdminUser", JSON.stringify(result.data.user));
        localStorage.setItem("locallinkAdminToken", result.data.token);
        localStorage.setItem("locallinkAdminUser", JSON.stringify(result.data.user));

        message.textContent = "Login successful! Redirecting...";
        message.className = "text-sm text-center text-emerald-400 font-semibold";

        setTimeout(() => {
          if (window.LocalLinkApp && typeof window.LocalLinkApp.goToRole === "function") {
            window.LocalLinkApp.goToRole("admin");
          } else {
            window.location.href = "index.html";
          }
        }, 400);
      } catch (error) {
        message.textContent = error.message || "Could not connect to the backend server.";
        message.className = "text-sm text-center text-rose-400";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
