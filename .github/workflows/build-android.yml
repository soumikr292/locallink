name: Build LocalLink Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: "Public HTTPS backend URL (e.g. https://locallink.up.railway.app)"
        required: false
        default: ""
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Release APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor & build dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets & sync Capacitor Android
        env:
          BACKEND_API_URL: ${{ github.event.inputs.backend_api_url || vars.BACKEND_API_URL || '' }}
        run: npm run app:sync

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/locallink-release.jks

      - name: Build Release APK & Play Store Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'app/locallink-release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: locallink-android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: locallink-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
