services:
  - type: web
    name: locallink-marketplace
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: AUTO_INIT_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ANDROID_PACKAGE_NAME
        value: com.locallink.marketplace
      - key: ANDROID_SHA256_FINGERPRINT
        sync: false
